name: Daily post

on:
  schedule:
    - cron: "0 19 * * *"   # 12:00 PM Pacific during daylight time (19:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next item to Instagram and Facebook
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 post.py
      - name: Save posted.json
        if: always()
        run: |
          git config user.name "readbank-autoposter"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Record daily post" && git pull --rebase && git push)
