name: Daily post

on:
  schedule:
    # GitHub has been starting scheduled runs about 7 hours late. post.py only posts 3 PM to 10 PM Pacific every day and
    # only once per day, so these spread-out times simply catch whichever run lands inside the window. Extra runs are harmless.
    - cron: "17 14 * * *"
    - cron: "43 16 * * *"
    - cron: "19 18 * * *"
    - cron: "11 20 * * *"
    - cron: "53 21 * * *"
    - cron: "7 23 * * *"
    - cron: "47 23 * * *"
    - cron: "3 1 * * *"
    - cron: "41 2 * * *"
    - cron: "23 4 * * *"
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test everything, post nothing | dry = show the next post | post = really post"
        default: "check"
        type: choice
        options: [check, dry, post]
      force:
        description: "Post even if something was already posted today (only for a manual post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      VIDEO_BASE_URL: https://e10than.github.io/readbank-autoposter
      FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token, accounts and the next videos
        run: python3 post.py --check
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry'
        run: python3 post.py --dry
      - name: Post the next video
        if: github.event_name == 'schedule' || inputs.mode == 'post'
        run: python3 post.py
      - name: Save posted.json
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'post')
        run: |
          git config user.name "readbank-autoposter"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Record daily post" && git pull --rebase && git push)
