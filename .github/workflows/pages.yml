name: Publish videos
on:
  push:
    branches: [main]
    paths: ["videos/**", "queue.json", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Daily post"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Pages struggles with huge uploads, so only the next 12 unposted videos are published (about 100 MB)
      - name: Copy the next 12 unposted videos
        run: |
          python3 - <<'PY'
          import json, os, shutil
          q = json.load(open("queue.json"))
          s = json.load(open("posted.json")) if os.path.exists("posted.json") else {}
          todo = [i for i in q if not (s.get(i["id"], {}).get("ig") and s.get(i["id"], {}).get("fb")) and not s.get(i["id"], {}).get("skipped")]
          os.makedirs("site/videos", exist_ok=True)
          for i in todo[:12]:
              shutil.copy(i["video"], "site/" + i["video"])
          open("site/.nojekyll", "w").close()
          print("published:", [i["id"] for i in todo[:12]])
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: d
        uses: actions/deploy-pages@v4
